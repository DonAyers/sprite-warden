[project]
name = "sprite-warden"
version = "0.1.0"
description = "Pixel Art Pipeline: Central Repository, Quality Judges, Jev Decision Routing, OpenRouter Fusion Strategy & Aseprite Integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Don Ayers", email = "dayers@carecontinuity.com" }
]
dependencies = [
    "pillow>=10.1.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
sprite-warden = "spritewarden.cli:main"
spritewarden = "spritewarden.cli:main"
warden = "spritewarden.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spritewarden"]
