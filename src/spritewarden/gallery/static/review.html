<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision review · sprite-warden</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/review.css"></head>
<body><main class="review-console"><header><h1>Revision review</h1><a href="/">Asset gallery</a></header>
<p>Failed candidates stay visible. A human decision does not erase measurements or automatically promote an asset.</p>
<p id="message" role="status"></p>
<div class="controls"><label>Character <select id="pipeline"></select></label><label>Candidate revision <select id="revision"></select></label><label>Facing <select id="facing"></select></label><label>Compare with <select id="before"></select></label></div>
<div class="controls"><label>Preview <select id="scale"><option value="1">Native 1×</option><option value="3">Game 3×</option><option value="6">Inspect 6×</option></select></label><label>Background <select id="background"><option value="#20242c">Dark</option><option value="#f2f2ed">Light</option></select></label><label>Frame width <input id="frame-width" type="number" min="1" max="4096" value="64"></label><label>Frame height <input id="frame-height" type="number" min="1" max="4096" value="64"></label><label><input id="sheet" type="checkbox"> Sheet / frame stepping</label><button id="previous">←</button><span id="frame-step">Frame 1</span><button id="next">→</button></div>
<div class="comparisons"><figure><figcaption>Before / source</figcaption><canvas id="before-canvas"></canvas></figure><figure><figcaption>Candidate (exact archived bytes)</figcaption><canvas id="after-canvas"></canvas></figure><figure><figcaption>Exact RGBA difference mask</figcaption><canvas id="diff-canvas"></canvas></figure></div>
<p id="comparison"></p><pre id="readiness"></pre>
<form id="decision"><h2>Record decision</h2><label>Actor <input id="actor" required maxlength="100"></label><label>Decision <select id="choice"><option value="accepted">Accept</option><option value="rejected">Reject</option><option value="accepted_with_exception">Accept with scoped exception</option></select></label><label>Exception gate <select id="gate"><option value="">None</option><option>symmetry</option><option>loop_smoothness</option><option>walk_mechanics</option><option>direction_set</option></select></label><label>Reason <textarea id="reason" required maxlength="4000"></textarea></label><button type="submit">Record exact-revision decision</button></form>
<details open><summary>Lineage, native IDs, evidence and decision history</summary><pre id="lineage"></pre></details><details><summary>Run trace (actual recorded costs, retries and corrections)</summary><pre id="trace"></pre></details>
</main><script src="/static/review.js"></script></body></html>
